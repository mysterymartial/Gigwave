spring:
  data:
    mongodb:
      # Embedded MongoDB will use a random port
      # The embedded MongoDB auto-configuration handles this
      database: gigwave_test

logging:
  level:
    com.gigwave: DEBUG
    org.springframework.data.mongodb: DEBUG
    de.flapdoodle.embed.mongo: INFO
    root: INFO

# Placeholders only for tests. Same env names as application.yml.
platform:
  settlement:
    number: ${PLATFORM_SETTLEMENT_NUMBER:0000000000}
    bank-code: ${PLATFORM_SETTLEMENT_BANK_CODE:070}
    name: ${PLATFORM_SETTLEMENT_NAME:Test Settlement}
  account:
    number: ${PLATFORM_ACCOUNT_NUMBER:0000000000}
    bank-code: ${PLATFORM_ACCOUNT_BANK_CODE:070}
    name: ${PLATFORM_ACCOUNT_NAME:Test Platform Account}

