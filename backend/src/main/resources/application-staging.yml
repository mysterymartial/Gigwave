spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27017}/${DB_NAME:gigwave_staging}}
      database: ${MONGODB_DATABASE:gigwave_staging}

logging:
  level:
    com.gigwave: INFO
    org.springframework.web: WARN

cors:
  allowed-origins: ${CORS_ORIGINS:https://staging.gigwave.com}

