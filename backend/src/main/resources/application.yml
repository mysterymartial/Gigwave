spring:
  application:
    name: gigwave-backend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gigwave}
      database: ${MONGODB_DATABASE:gigwave}
  
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}  # Railway provides PORT environment variable
  # Public URL for webhooks (e.g. OnePipe callback). Set SERVER_URL in Railway/env.
  url: ${SERVER_URL:http://localhost:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-characters}
  expiration: 86400000 # 24 hours in milliseconds

onepipe:
  base-url: ${ONEPIPE_BASE_URL:https://api.onepipe.io/v2/transact}
  api-key: ${ONEPIPE_API_KEY:your-onepipe-api-key}
  secret-key: ${ONEPIPE_SECRET_KEY:your-onepipe-secret-key}
  environment: ${ONEPIPE_ENV:sandbox}
  biller-code: ${ONEPIPE_BILLER_CODE:}
  # mock_mode: Live (production) or Inspect (test). Default Live.
  mock-mode: ${ONEPIPE_MOCK_MODE:Live}
  # encryption: ecb (default; matches Postman doc: ECB + 24-byte key + UTF-8) or paywithaccount
  encryption: ${ONEPIPE_ENCRYPTION:ecb}

# Flutterwave Transfer Configuration
# Used for transferring money to musicians after deducting platform fee and Flutterwave charges
# Sign up at: https://flutterwave.com
# Get your secret key from Flutterwave dashboard
flutterwave:
  secret-key: ${FLUTTERWAVE_SECRET_KEY:}
  base-url: ${FLUTTERWAVE_BASE_URL:https://api.flutterwave.com/v3}
  enabled: ${FLUTTERWAVE_ENABLED:false}
  verif-hash: ${FLUTTERWAVE_VERIF_HASH:} # Webhook secret hash from Flutterwave dashboard (Settings > Webhooks); required to verify payout webhooks
  transfer:
    charge: ${FLUTTERWAVE_TRANSFER_CHARGE:10} # Flutterwave charge per transfer (typically ₦10-15 in Nigeria)

# GigWave platform configuration. Set via env; no defaults for account details.
# Use same names in .env / Railway: PLATFORM_FEE_AMOUNT, PLATFORM_SETTLEMENT_*, PLATFORM_ACCOUNT_*
platform:
  fee:
    amount: ${PLATFORM_FEE_AMOUNT:200}
  settlement:
    number: ${PLATFORM_SETTLEMENT_NUMBER}
    bank-code: ${PLATFORM_SETTLEMENT_BANK_CODE}
    name: ${PLATFORM_SETTLEMENT_NAME}
  account:
    number: ${PLATFORM_ACCOUNT_NUMBER}
    bank-code: ${PLATFORM_ACCOUNT_BANK_CODE}
    name: ${PLATFORM_ACCOUNT_NAME}

logging:
  level:
    com.gigwave: DEBUG
    org.springframework.security: DEBUG

file:
  storage:
    # Default 'local'; set FILE_STORAGE_TYPE=imagekit to use ImageKit
    type: ${FILE_STORAGE_TYPE:local}
  upload:
    chat-media-dir: uploads/chat-media
    dispute-evidence-dir: uploads/dispute-evidence
    kyc-document-dir: uploads/kyc-documents
    report-evidence-dir: uploads/report-evidence
    performance-video-dir: uploads/performance-videos
    venue-image-dir: uploads/venue-images
    max-file-size: 10MB
    max-request-size: 10MB

# ImageKit Configuration (set in .env when FILE_STORAGE_TYPE=imagekit)
imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY:}
  private-key: ${IMAGEKIT_PRIVATE_KEY:}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT:}

# Notification service configuration
# Termii is a Nigerian provider that supports SMS, Email, and WhatsApp
# Get your API key from: https://termii.com
notification:
  sms:
    enabled: ${NOTIFICATION_SMS_ENABLED:false}
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
  whatsapp:
    enabled: ${NOTIFICATION_WHATSAPP_ENABLED:false}
  provider:
    sms: ${NOTIFICATION_PROVIDER_SMS:log} # Options: 'log', 'termii'
    email: ${NOTIFICATION_PROVIDER_EMAIL:log} # Options: 'log', 'termii'
    whatsapp: ${NOTIFICATION_PROVIDER_WHATSAPP:log} # Options: 'log', 'termii'

# Termii API configuration
# Sign up at https://termii.com to get your API key
termii:
  api-key: ${TERMII_API_KEY:}
  base-url: ${TERMII_BASE_URL:https://v3.api.termii.com}
  sender-id: ${TERMII_SENDER_ID:GigWave} # Your registered sender ID
  sms:
    enabled: ${TERMII_SMS_ENABLED:false}
  email:
    enabled: ${TERMII_EMAIL_ENABLED:false}
  whatsapp:
    enabled: ${TERMII_WHATSAPP_ENABLED:false}

