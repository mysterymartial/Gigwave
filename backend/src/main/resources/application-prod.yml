spring:
  data:
    mongodb:
      # MongoDB Atlas connection string - MUST be set via MONGODB_URI environment variable
      # Format: mongodb+srv://username:password@cluster0.xxxxx.mongodb.net/gigwave_prod?retryWrites=true&w=majority
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:gigwave_prod}

logging:
  level:
    com.gigwave: WARN
    org.springframework: WARN
    root: INFO
  # No file logging: Railway captures stdout; /var/log often not writable in containers

cors:
  allowed-origins: ${CORS_ORIGINS:https://gigwave.com}

server:
  port: ${PORT:8080}
  address: 0.0.0.0   # Required for Railway: listen on all interfaces
  error:
    include-stacktrace: never
    include-message: on-param

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# File storage: default local so app can start without ImageKit.
# Set FILE_STORAGE_TYPE=imagekit and IMAGEKIT_* vars to use ImageKit in prod.
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}

# Platform settlement: placeholders so PaymentService bean can start.
# Replace with real values in Railway Variables before processing real payouts.
platform:
  settlement:
    number: ${PLATFORM_SETTLEMENT_NUMBER:0000000000}
    bank-code: ${PLATFORM_SETTLEMENT_BANK_CODE:070}
    name: ${PLATFORM_SETTLEMENT_NAME:Platform}
  account:
    number: ${PLATFORM_ACCOUNT_NUMBER:0000000000}
    bank-code: ${PLATFORM_ACCOUNT_BANK_CODE:070}
    name: ${PLATFORM_ACCOUNT_NAME:Platform}
