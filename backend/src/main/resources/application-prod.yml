spring:
  data:
    mongodb:
      # MongoDB Atlas connection string - MUST be set via MONGODB_URI environment variable
      # Format: mongodb+srv://username:password@cluster0.xxxxx.mongodb.net/gigwave_prod?retryWrites=true&w=majority
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:gigwave_prod}

logging:
  level:
    com.gigwave: WARN
    org.springframework: WARN
    root: INFO
  # No file logging: Railway captures stdout; /var/log often not writable in containers

cors:
  allowed-origins: ${CORS_ORIGINS:https://gigwave.com}

server:
  port: ${PORT:8080}
  address: 0.0.0.0   # Required for Railway: listen on all interfaces
  error:
    include-stacktrace: never
    include-message: on-param

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ImageKit Configuration (Production)
imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  private-key: ${IMAGEKIT_PRIVATE_KEY}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}

file:
  storage:
    type: ${FILE_STORAGE_TYPE:imagekit}
